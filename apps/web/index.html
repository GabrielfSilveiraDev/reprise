<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Toda capa deste app vem do CDN do TMDB, e o custo dela é o aperto de mão, não o download:
      uma capa em w154 tem ~7 KB, enquanto DNS + TCP + TLS com image.tmdb.org custam uns 300 ms.
      O `preconnect` paga essa conta durante o carregamento da página, para a primeira imagem
      pedida já encontrar a conexão aberta.
    -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <meta
      name="description"
      content="Reprise — rastreador pessoal de séries. Uma exibição é um evento, não um booleano."
    />
    <title>Reprise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
