<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Reprise — seu diário de séries. Cada exibição conta." />
    <meta name="theme-color" content="#F6F4F0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Reprise</title>
    <script>
      // Antes do primeiro pixel: aplica o tema e o design salvos (ou os padrões) para a página
      // não piscar em outra cor antes de assumir a sua. ThemeController e DesignController
      // assumem daqui em diante — e é deles a lista de designs válidos; esta é só a cópia mínima.
      ;(function () {
        var pref = 'system'
        var design = 'brasa'
        try {
          pref = localStorage.getItem('reprise.theme') || 'system'
          design = localStorage.getItem('reprise.design') || 'brasa'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.design = /^(brasa|sessao|grade)$/.test(design) ? design : 'brasa'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
