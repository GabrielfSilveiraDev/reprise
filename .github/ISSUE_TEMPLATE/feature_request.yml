name: Feature request
description: An idea to make Reprise better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Reprise makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Screens, examples and alternatives you considered all help.
